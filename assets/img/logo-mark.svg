<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none" role="img" aria-label="Rewind Dynamics">
  <defs>
    <linearGradient id="rd-metal" x1="40" y1="14" x2="112" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#DCE4F0"/>
      <stop offset="1" stop-color="#AAB8CE"/>
    </linearGradient>
    <linearGradient id="rd-streak" x1="0" y1="0" x2="46" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F7BFF" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#3F87FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7FB4FF"/>
    </linearGradient>
    <filter id="rd-glow" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- motion streak -->
  <g filter="url(#rd-glow)">
    <rect x="0" y="47.6" width="46" height="4.8" fill="url(#rd-streak)"/>
    <rect x="18" y="49.2" width="28" height="1.6" fill="#BFD8FF"/>
  </g>

  <!-- motion chevron -->
  <path d="M30 50 L56 33 L56 45 L44 50 L56 55 L56 67 Z" fill="url(#rd-metal)"/>

  <!-- R monogram -->
  <g fill="url(#rd-metal)">
    <rect x="58" y="20" width="16" height="60"/>
    <path fill-rule="evenodd" d="M74 20 H98 L110 32 V42 L98 54 H74 Z M78 30 H94 L100 37 V40 L94 47 H78 Z"/>
    <path d="M74 48 H90 L116 80 H100 Z"/>
  </g>
</svg>
